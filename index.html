<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로딩 화면</title>
<style>
  :root { --bg:#00030b; --line:#00b4ff; --text:#bfeaff; box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden;
    font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  .stage { position:relative; width:min(100vw, calc(100vh * 1662 / 946)); aspect-ratio:1662/946;
    container-type:inline-size; cursor:pointer;
    background:radial-gradient(ellipse at 50% 50%, #00122b 0%, var(--bg) 70%); }
  svg.frame { position:absolute; inset:0; width:100%; height:100%; }
  .glowline { fill:none; stroke:var(--line); stroke-width:5; stroke-linejoin:miter;
    filter:drop-shadow(0 0 6px #00b4ff) drop-shadow(0 0 16px #0077ff); }
  .deco { fill:#0a3f78; opacity:.45; }
  .title { position:absolute; left:0; right:0; top:19.5%; text-align:center; color:#e6f7ff;
    font-weight:700; font-size:5.2cqw; letter-spacing:.02em;
    text-shadow:0 0 8px #00b4ff, 0 0 20px #0080ff; }
  .bar { position:absolute; left:24.07%; width:51.9%; top:48.5%; height:7.4%;
    border:.4cqw solid #0a9bff; box-sizing:border-box;
    box-shadow:0 0 14px rgba(0,150,255,.55), inset 0 0 14px rgba(0,150,255,.25); }
  .fill { height:100%; width:0%; background:linear-gradient(90deg,#0066d6,#00c8ff);
    box-shadow:0 0 18px #00b4ff; }
  .pct { position:absolute; left:0; right:0; top:56.5%; text-align:center; color:var(--text);
    font-size:3.2cqw; font-weight:500; text-shadow:0 0 10px #00b4ff; font-variant-numeric:tabular-nums; }
  .hint { position:absolute; left:0; right:0; top:66%; text-align:center; color:#e6f7ff;
    font-size:2.4cqw; font-weight:500; opacity:0; text-shadow:0 0 10px #00b4ff; }
  .hint.show { opacity:1; animation:blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .stage { transition:opacity .6s; }
  .stage.out { opacity:0; pointer-events:none; }
  #game { position:fixed; inset:0; overflow:hidden; background:#000; display:none; opacity:0; transition:opacity .8s; }
  #game.on { display:block; }
  #game canvas { display:block; touch-action:none; }
  #game.vis { opacity:1; }
  #view { position:absolute; inset:0; transform-origin:58% 55%; will-change:transform; }
  #view img { width:100%; height:100%; object-fit:cover; display:block; user-select:none; -webkit-user-drag:none; }
  #help { position:absolute; left:0; right:0; top:max(18px, env(safe-area-inset-top, 0px)); text-align:center; color:#fff;
    font:500 15px "Noto Sans KR","Malgun Gothic",sans-serif; text-shadow:0 1px 6px rgba(0,0,0,.7); transition:opacity 1s; }
  #pad { position:absolute; left:20px; bottom:max(20px, env(safe-area-inset-bottom, 0px)); display:none;
    grid-template-columns:repeat(3,56px); grid-template-rows:repeat(2,56px); gap:6px; touch-action:none; }
  #pad button { border:0; border-radius:12px; background:rgba(0,0,0,.45); color:#fff; font:700 18px sans-serif; touch-action:none; }
  #pad button[data-k="KeyW"] { grid-column:2; grid-row:1; }
  #pad button[data-k="KeyA"] { grid-column:1; grid-row:2; }
  #pad button[data-k="KeyS"] { grid-column:2; grid-row:2; }
  #pad button[data-k="KeyD"] { grid-column:3; grid-row:2; }
  /* 하단 아이템 바 스타일 */
  #hotbar { position:absolute; left:50%; bottom:max(20px, env(safe-area-inset-bottom, 0px)); transform:translateX(-50%);
    display:flex; gap:8px; padding:8px; border-radius:16px; background:rgba(10,18,32,.62);
    border:1.5px solid rgba(255,255,255,.22); backdrop-filter:blur(6px); z-index:20; user-select:none; }
  .slot { position:relative; width:56px; height:56px; border-radius:12px; background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .12s, border-color .15s, background .15s, box-shadow .15s; }
  .slot:hover { background:rgba(255,255,255,.16); }
  .slot.active { border-color:#00c8ff; background:rgba(0,180,255,.22);
    box-shadow:0 0 14px rgba(0,200,255,.65); transform:translateY(-3px); }
  .slot .num { position:absolute; top:4px; left:7px; font:700 11px sans-serif; color:rgba(255,255,255,.75); }
  .slot svg { width:36px; height:36px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  /* 낚시 던지기/감기 액션 버튼 */
  #fishBtn { position:absolute; right:28px; bottom:max(28px, env(safe-area-inset-bottom, 0px));
    padding:14px 26px; border-radius:999px; border:2px solid #7ce2ff;
    background:linear-gradient(135deg, rgba(0,114,255,.88), rgba(0,198,255,.88));
    color:#fff; font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif; letter-spacing:.04em;
    box-shadow:0 4px 18px rgba(0,180,255,.55), inset 0 1px 0 rgba(255,255,255,.4);
    cursor:pointer; display:none; z-index:25; user-select:none; touch-action:none;
    transition:transform .12s, box-shadow .15s, background .15s; }
  #fishBtn:hover { transform:scale(1.05); box-shadow:0 6px 24px rgba(0,210,255,.8); }
  #fishBtn:active { transform:scale(0.96); }
  #fishBtn.casting { border-color:#ffd166; background:linear-gradient(135deg, rgba(230,110,0,.9), rgba(255,175,0,.9));
    box-shadow:0 4px 18px rgba(255,165,0,.6); }
  /* 낚시 미니게임 UI (Fisch 스타일) */
  #fishGame { position:absolute; left:50%; bottom:max(14%, 72px); transform:translateX(-50%);
    width:min(540px, 90vw); display:none; flex-direction:column; align-items:center; gap:10px;
    z-index:40; user-select:none; touch-action:none; }
  .fg-track-wrap { position:relative; width:100%; height:44px; background:#232830;
    border:3px solid #d4dae3; border-radius:6px; box-shadow:0 8px 26px rgba(0,0,0,.75);
    display:flex; align-items:center; padding:0 8px; box-sizing:border-box; }
  .fg-inner { position:relative; width:100%; height:24px; background:#0d1015; border-radius:3px; overflow:visible; }
  .fg-white { position:absolute; top:-3px; height:30px; width:28%; left:36%; background:#f7f8fa;
    border-radius:3px; box-shadow:0 0 12px rgba(255,255,255,.55);
    display:flex; align-items:center; justify-content:space-between; padding:0 8px; box-sizing:border-box; }
  .fg-white span { color:#4a515c; font:900 14px sans-serif; line-height:1; }
  .fg-gray { position:absolute; top:-8px; width:7px; height:40px; left:50%; transform:translateX(-50%);
    background:#484f59; border:1.5px solid #16191e; border-radius:2px;
    box-shadow:0 0 6px rgba(0,0,0,.8); z-index:3; }
  .fg-gray::before { content:''; position:absolute; top:-7px; left:50%; transform:translateX(-50%);
    width:8px; height:5px; border:2px solid #484f59; border-bottom:0; border-radius:4px 4px 0 0; }
  .fg-prog-wrap { width:76%; height:11px; background:#14181f; border:2px solid #8c96a6;
    border-radius:4px; overflow:hidden; box-shadow:0 4px 12px rgba(0,0,0,.6); }
  .fg-prog-fill { width:25%; height:100%; background:linear-gradient(90deg, #9aa4b2, #ffffff);
    box-shadow:0 0 8px rgba(255,255,255,.7); }
  .fg-tip { color:#fff; font:600 13px "Noto Sans KR","Malgun Gothic",sans-serif;
    text-shadow:0 1px 4px rgba(0,0,0,.85); opacity:.9; }
  /* 물고기 획득 알림 배너 */
  #catchToast { position:absolute; left:50%; top:22%; transform:translate(-50%, -10px);
    padding:14px 28px; border-radius:16px; background:rgba(12,24,44,.86);
    border:2px solid #00c8ff; color:#fff; font:700 19px "Noto Sans KR","Malgun Gothic",sans-serif;
    box-shadow:0 0 24px rgba(0,200,255,.65); opacity:0; pointer-events:none;
    transition:opacity .3s, transform .3s; z-index:50; text-align:center; }
  #catchToast.show { opacity:1; transform:translate(-50%, 0); }
  /* 좌측 상단 재화 및 물고기 판매 UI */
  #shopHud { position:absolute; left:18px; top:max(18px, env(safe-area-inset-top, 0px));
    display:flex; flex-direction:column; gap:8px; z-index:30; user-select:none; }
  .hud-stats { display:flex; gap:10px; padding:8px 14px; border-radius:12px;
    background:rgba(10,18,32,.68); border:1.5px solid rgba(255,255,255,.22);
    backdrop-filter:blur(6px); color:#fff; font:700 14px "Noto Sans KR","Malgun Gothic",sans-serif; }
  #sellBtn { padding:10px 16px; border-radius:12px; border:1.5px solid #ffd166;
    background:linear-gradient(135deg, rgba(235,140,0,.92), rgba(255,190,11,.92));
    color:#1c1300; font:800 14px "Noto Sans KR","Malgun Gothic",sans-serif;
    box-shadow:0 4px 14px rgba(255,180,0,.45); cursor:pointer; display:none;
    transition:transform .12s, box-shadow .15s; text-align:center; }
  #sellBtn:hover { transform:scale(1.04); box-shadow:0 6px 18px rgba(255,200,0,.7); }
  #sellBtn:active { transform:scale(0.96); }
  /* NPC 말걸기 버튼 및 대화창 */
  #talkBtn { position:absolute; left:50%; bottom:max(96px, calc(env(safe-area-inset-bottom, 0px) + 88px));
    transform:translateX(-50%); padding:12px 24px; border-radius:999px; border:2px solid #ff6b6b;
    background:linear-gradient(135deg, rgba(160,20,35,.92), rgba(220,45,65,.92));
    color:#fff; font:700 16px "Noto Sans KR","Malgun Gothic",sans-serif;
    box-shadow:0 4px 18px rgba(220,30,50,.65); cursor:pointer; display:none; z-index:26; user-select:none; }
  #npcDialog { position:absolute; left:50%; bottom:max(105px, calc(env(safe-area-inset-bottom, 0px) + 95px));
    transform:translateX(-50%); width:min(420px, 88vw); padding:18px 20px; border-radius:16px;
    background:rgba(20,10,16,.92); border:2px solid #c92a3e; color:#fff;
    box-shadow:0 10px 30px rgba(0,0,0,.8); display:none; flex-direction:column; gap:12px; z-index:45; }
  .npc-name { font:800 16px "Noto Sans KR","Malgun Gothic",sans-serif; color:#ff6b7a; }
  .npc-text { font:500 14px/1.5 "Noto Sans KR","Malgun Gothic",sans-serif; color:#f2e6e8; }
  .npc-btns { display:flex; gap:8px; justify-content:flex-end; }
  .npc-btns button { padding:8px 16px; border-radius:10px; border:0; font:700 14px "Noto Sans KR","Malgun Gothic",sans-serif; cursor:pointer; }
  #npcPayBtn { background:linear-gradient(135deg, #d62839, #ff4d5e); color:#fff; box-shadow:0 2px 10px rgba(220,40,60,.5); }
  #npcCloseBtn { background:rgba(255,255,255,.15); color:#ddd; }
  /* 상단 특별 획득 배너 */
  #specialBanner { position:absolute; left:50%; top:11%; transform:translate(-50%, -12px);
    padding:14px 32px; border-radius:14px; background:rgba(30,6,12,.92);
    border:2.5px solid #ff2a4b; color:#ffccd5; font:900 22px "Noto Sans KR","Malgun Gothic",sans-serif;
    text-shadow:0 0 12px #ff1e42, 0 0 24px #b3001b; box-shadow:0 0 28px rgba(255,30,66,.75);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:60; white-space:nowrap; }
  #specialBanner.show { opacity:1; transform:translate(-50%, 0); }
  /* 붉은 참격 베기 이펙트 */
  .fg-slash { position:absolute; left:-8%; top:50%; width:116%; height:6px;
    background:linear-gradient(90deg, transparent 0%, #ff1a3c 18%, #ffffff 50%, #ff1a3c 82%, transparent 100%);
    box-shadow:0 0 14px #ff002b, 0 0 28px #ff1a3c;
    transform:translateY(-50%) rotate(-5deg) scaleX(0); opacity:0; pointer-events:none; z-index:10; }
  .fg-slash.active { animation:slashCut 0.55s cubic-bezier(.15,.85,.25,1) forwards; }
  @keyframes slashCut {
    0% { opacity:1; transform:translateY(-50%) rotate(-5deg) scaleX(0); }
    35% { opacity:1; transform:translateY(-50%) rotate(-5deg) scaleX(1.06); }
    100% { opacity:0; transform:translateY(-50%) rotate(-5deg) scaleX(1.12); }
  }
  /* 보스 물고기 노란색 기둥 공격 이펙트 */
  .fg-pillar-warn { position:absolute; top:-22px; width:16px; height:88px; transform:translateX(-50%);
    background:rgba(255, 225, 40, 0.22); border:1.5px dashed #ffe600; border-radius:4px;
    pointer-events:none; z-index:4; animation:pillarWarnPulse .35s infinite alternate; }
  .fg-pillar { position:absolute; top:-34px; width:20px; height:112px; transform:translateX(-50%);
    background:linear-gradient(180deg, #fff799 0%, #ffd000 50%, #ff9900 100%);
    box-shadow:0 0 18px #ffdd00, 0 0 32px #ffaa00; border-radius:4px;
    pointer-events:none; z-index:9; animation:pillarStrike .45s ease-out forwards; }
  @keyframes pillarWarnPulse { from { opacity:.35; } to { opacity:.9; } }
  @keyframes pillarStrike {
    0% { opacity:1; transform:translateX(-50%) scaleY(0.15); }
    35% { opacity:1; transform:translateX(-50%) scaleY(1.08); }
    100% { opacity:0; transform:translateX(-50%) scaleY(1); }
  }
  @media (max-width:600px) {
    #hotbar { gap:6px; padding:6px; bottom:max(14px, env(safe-area-inset-bottom, 0px)); }
    .slot { width:46px; height:46px; }
    .slot svg { width:28px; height:28px; }
    #pad { bottom:max(82px, calc(env(safe-area-inset-bottom, 0px) + 74px)); }
    #fishBtn { right:18px; bottom:max(86px, calc(env(safe-area-inset-bottom, 0px) + 78px)); padding:12px 20px; font-size:15px; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg class="frame" viewBox="0 0 1662 946" preserveAspectRatio="none" aria-hidden="true">
    <polyline class="glowline" points="0,32 215,36 277,72 565,72 620,35 1045,35 1098,72 1385,72 1448,36 1662,33"/>
    <polyline class="glowline" points="0,893 218,895 282,860 566,860 618,897 1045,897 1098,860 1382,860 1445,897 1662,895"/>
    <polygon class="deco" points="70,50 125,50 70,172 15,172"/>
    <polygon class="deco" points="145,50 200,50 145,172 90,172"/>
    <polygon class="deco" points="1470,50 1525,50 1580,172 1525,172"/>
    <polygon class="deco" points="1545,50 1600,50 1655,172 1600,172"/>
    <polygon class="deco" points="35,775 90,775 145,875 90,875"/>
    <polygon class="deco" points="100,775 150,775 195,875 135,875"/>
    <polygon class="deco" points="1565,778 1620,778 1560,875 1505,875"/>
    <polygon class="deco" points="1635,778 1685,778 1625,875 1570,875"/>
  </svg>
  <div class="title">[ 제목을 짓기 귀찮아 버린;]</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="pct" id="pct">0%</div>
  <div class="hint" id="hint">화면을 터치해서 시작하세요</div>
</div>
<div id="game">
  <div id="help">W/A/S/D 이동 · 마우스 드래그 / 방향키 / Q·E 로 화면 회전 · Shift 달리기 · Space 점프 · 1번: 낚싯대</div>
  <!-- 좌측 상단 소지금 / 물고기 및 판매 버튼 -->
  <div id="shopHud">
    <div class="hud-stats">
      <span id="moneyText">💰 0원</span>
      <span>|</span>
      <span id="fishCountText">🐟 0마리</span>
    </div>
    <button id="sellBtn" type="button">💰 물고기 판매 (1원)</button>
  </div>
  <div id="pad"><button data-k="KeyW">W</button><button data-k="KeyA">A</button><button data-k="KeyS">S</button><button data-k="KeyD">D</button></div>
  <!-- 하단 아이템 바 -->
  <div id="hotbar">
    <div class="slot" data-slot="1" title="낚싯대 (1)">
      <span class="num">1</span>
      <svg viewBox="0 0 40 40" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 32 C14 22, 22 14, 32 8" stroke="#c88a4b" stroke-width="3"/>
        <circle cx="13" cy="27" r="2.6" fill="#9aa7b8" stroke="#465261" stroke-width="1"/>
        <path d="M32 8 L32 23" stroke="#e6f7ff" stroke-width="1.3" stroke-dasharray="2 1.5"/>
        <circle cx="32" cy="25" r="2.4" fill="#ff4d4d"/>
      </svg>
    </div>
    <div class="slot" data-slot="2" id="slot2"><span class="num">2</span></div>
    <div class="slot" data-slot="3"><span class="num">3</span></div>
    <div class="slot" data-slot="4"><span class="num">4</span></div>
    <div class="slot" data-slot="5" id="slot5" title="휘슬 (5)">
      <span class="num">5</span>
      <svg viewBox="0 0 40 40" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 14 L29 14 L29 21 L23 23 A8 8 0 1 1 12 14 Z" fill="#ffd43b" stroke="#8f6200" stroke-width="2"/>
        <circle cx="15" cy="23" r="3.2" fill="#8f6200"/>
        <path d="M22 14 L22 18" stroke="#8f6200" stroke-width="2"/>
        <path d="M31 11 L35 9 M32 16 L36 16 M31 21 L35 23" stroke="#fff3bf" stroke-width="1.8"/>
      </svg>
    </div>
  </div>
  <!-- NPC 말걸기 및 대화창 -->
  <button id="talkBtn" type="button">💬 말걸기</button>
  <div id="npcDialog">
    <div class="npc-name">붉은 안개의 해결사</div>
    <div class="npc-text" id="npcText">"이봐, 1원만 주면 내가 아끼는 특별한 낚싯대를 넘겨주지. 어때?"</div>
    <div class="npc-btns">
      <button id="npcPayBtn" type="button">💰 1원 주기</button>
      <button id="npcCloseBtn" type="button">닫기</button>
    </div>
  </div>
  <!-- 상단 특별 획득 문구 -->
  <div id="specialBanner">[미1미 큿리히;; 획드으윽!]</div>
  <!-- 호수 앞 던지기 버튼 -->
  <button id="fishBtn" type="button">🎣 던지기</button>
  <!-- 낚시 미니게임 UI -->
  <div id="fishGame">
    <div class="fg-track-wrap" id="fgTrack">
      <div class="fg-inner">
        <div class="fg-white" id="fgWhite"><span>←</span><span>→</span></div>
        <div class="fg-gray" id="fgGray"></div>
      </div>
      <div class="fg-slash" id="fgSlash"></div>
    </div>
    <div class="fg-prog-wrap"><div class="fg-prog-fill" id="fgProg"></div></div>
    <div class="fg-tip">화면 꾹 누르기 / Space : 흰색 바 오른쪽 이동 · 떼기 : 왼쪽 이동</div>
  </div>
  <!-- 물고기 획득 알림 -->
  <div id="catchToast"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var fill = document.getElementById('fill'), pct = document.getElementById('pct'), hint = document.getElementById('hint'),
      stage = document.getElementById('stage'), game = document.getElementById('game'),
      help = document.getElementById('help'), pad = document.getElementById('pad');
  var seed = 7;
  function R() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  function PX(z) { return 5 + 14 * Math.sin(z * 0.03); }
  // 시작 지점(Z=-108) 바로 앞쪽에 넓고 아름다운 호수 배치
  var LR = 24, LZ = -72, LX = PX(-108) + 6, LW = 2.2;
  function LD(x, z) { return Math.hypot(x - LX, z - LZ); }
  function sm(a, b, x) { x = Math.max(0, Math.min(1, (x - a) / (b - a))); return x * x * (3 - 2 * x); }
  function H(x, z) {
    var b = 4 + 2.2 * Math.sin(x * 0.045 + 1) * Math.cos(z * 0.035) + 1.4 * Math.sin(x * 0.09 + z * 0.07) + 0.7 * Math.sin(z * 0.11 + x * 0.05);
    var d = LD(x, z); b += (3.2 - b) * sm(LR * 1.7, LR * 1.1, d); b -= 3.6 * sm(LR, LR * 0.5, d);
    var s = Math.max(0, Math.min(1, (-48 - x) / 27));
    return b - 16 * s * s * (3 - 2 * s);
  }
  var touch = 'ontouchstart' in window;
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  game.insertBefore(renderer.domElement, game.firstChild);
  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xbfe0ff, 90, 430);
  var camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1500);
  camera.rotation.order = 'YXZ';
  scene.add(camera);
  var D = new THREE.Object3D(), col = new THREE.Color(), C = [], clouds = null;

  // 1인칭 낚싯대 모델 구성 (카메라에 부착)
  var rodGroup = new THREE.Group();
  var rodGrip = new THREE.Mesh(
    new THREE.CylinderGeometry(0.022, 0.026, 0.36, 10),
    new THREE.MeshLambertMaterial({ color: 0x3b2414 })
  );

    }

    // 낚싯대(1번 또는 2번 특수 낚싯대) 장착 애니메이션 및 걷기 흔들림
    var currentRod = rodGroup.visible ? rodGroup : (mimicryGroup.visible ? mimicryGroup : null);
    if (currentRod) {
      equipAnim = Math.max(0, equipAnim - dt * 5);
      var swayX = Math.cos(bob * 0.5) * 0.018 * mv;
      var swayY = Math.abs(Math.sin(bob * 0.5)) * 0.022 * mv;
      var castSwing = isCasting ? Math.max(0, 1 - castTime * 4) * 0.45 : 0;
      var tugShake = miniActive ? Math.sin(t * 0.04) * 0.03 : 0;
      currentRod.position.set(0.36 + swayX + tugShake, -0.52 - swayY - equipAnim * 0.25, -0.45);
      currentRod.rotation.set(-0.55 - equipAnim * 0.45 - castSwing + Math.sin(bob * 0.5) * 0.03 * mv + tugShake, 0.18, 0.12);
      currentRod.updateMatrixWorld();

      // 던져진 찌와 낚싯줄 업데이트
      if (isCasting) {
        castTime += dt;
        var p = Math.min(1, castTime / 0.45);
        var ease = 1 - Math.pow(1 - p, 3);
        var arc = Math.sin(p * Math.PI) * 2.4;
        var bobWave = p >= 1 ? (miniActive ? Math.sin(t * 0.035) * 0.12 - 0.06 : Math.sin(t * 0.005) * 0.045) : 0;
        worldBobber.position.set(
          castStart.x + (castTarget.x - castStart.x) * ease,
          castStart.y + (castTarget.y - castStart.y) * ease + arc + bobWave,
          castStart.z + (castTarget.z - castStart.z) * ease
        );
        currentRod.localToWorld(tipPos.set(0, 1.72, 0));
        var midX = (tipPos.x + worldBobber.position.x) * 0.5;
        var midY = Math.min(tipPos.y, worldBobber.position.y) - (p >= 1 ? 0.35 : 0.1);
        var midZ = (tipPos.z + worldBobber.position.z) * 0.5;
        var posAttr = castLineGeo.attributes.position;
        posAttr.setXYZ(0, tipPos.x, tipPos.y, tipPos.z);
        posAttr.setXYZ(1, midX, midY, midZ);
        posAttr.setXYZ(2, worldBobber.position.x, worldBobber.position.y + 0.08, worldBobber.position.z);
        posAttr.needsUpdate = true;
      }
    }

    // 낚시 미니게임 물리 및 게이지 업데이트
    if (miniActive) {
      var pressing = holdReel || K.Space || K.ArrowRight || K.KeyD;
      var accel = pressing ? 155 : -145;
      whiteVel += accel * dt;
      whiteVel *= Math.pow(0.06, dt);
      whitePos += whiteVel * dt;
      if (whitePos < 0) { whitePos = 0; whiteVel = Math.max(0, -whiteVel * 0.3); }
      // 흰색 바 안에 회색 바가 들어왔는지 판정 (보스 물고기는 게이지 차는 속도가 90% 느림)
      var inside = (grayPos >= whitePos && grayPos <= whitePos + whiteWidth);
      var fillRate = isBossFight ? (24 * 0.1) : 24;
      if (inside) {
        catchProgress += fillRate * dt;
        fgWhite.style.boxShadow = '0 0 16px rgba(120,255,180,.9)';
      } else {
        catchProgress -= 14 * dt;
        fgWhite.style.boxShadow = '0 0 12px rgba(255,255,255,.55)';
      }

      // 보스 물고기 노란색 기둥 공격 타이머
      if (isBossFight) {
        pillarTimer -= dt;
        if (pillarTimer <= 0) {
          pillarTimer = 3.6 + Math.random() * 1.2;
          spawnYellowPillarAttack();
        }
      }

      fgWhite.style.left = whitePos + '%';
      fgGray.style.left = grayPos + '%';
      fgProg.style.width = Math.max(0, Math.min(100, catchProgress)) + '%';

      if (catchProgress >= 100) endMinigame(true);
      else if (catchProgress <= 0) endMinigame(false);
    }

    if (clouds) clouds.position.x += dt * 2;
    renderer.render(scene, camera); requestAnimationFrame(loop);
  }
  function startGame() {
    if (running || !ready) return; running = true;
    stage.classList.add('out'); game.classList.add('on');
    requestAnimationFrame(function () { game.classList.add('vis'); });
    if (touch) pad.style.display = 'grid';
    setTimeout(function () { help.style.opacity = 0; }, 8000);
    last = performance.now(); requestAnimationFrame(loop);
  }
  stage.addEventListener('click', startGame);
  addEventListener('keydown', function (e) {
    K[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
    if (!e.repeat && /^Digit[1-5]$/.test(e.code)) selectSlot(Number(e.code.slice(5)));
  });
  addEventListener('keyup', function (e) { K[e.code] = false; });
  addEventListener('blur', function () { K = {}; });
  addEventListener('resize', function () { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
  var lp = null, cv = renderer.domElement, hotbar = document.getElementById('hotbar');
  game.addEventListener('pointerdown', function (e) {
    if (miniActive) { holdReel = true; return; }
    if (pad.contains(e.target) || hotbar.contains(e.target) || fishBtn.contains(e.target) || shopHud.contains(e.target) || talkBtn.contains(e.target) || npcDialog.contains(e.target)) return; lp = e;
    try { game.setPointerCapture(e.pointerId); } catch (x) {}
  });
  game.addEventListener('dblclick', function (e) {
    if (miniActive || pad.contains(e.target) || hotbar.contains(e.target) || fishBtn.contains(e.target) || shopHud.contains(e.target) || talkBtn.contains(e.target) || npcDialog.contains(e.target)) return;
    try { var q = cv.requestPointerLock(); if (q && q.catch) q.catch(function () {}); } catch (x) {}
  });
  game.addEventListener('pointermove', function (e) {
    if (miniActive) return;
    if (document.pointerLockElement === cv) look(e.movementX, e.movementY);
    else if (lp && !pad.contains(e.target) && !hotbar.contains(e.target) && !fishBtn.contains(e.target) && !shopHud.contains(e.target) && !talkBtn.contains(e.target) && !npcDialog.contains(e.target)) {
      // 왼쪽으로 드래그(clientX 감소)하면 왼쪽 회전, 오른쪽으로 드래그(clientX 증가)하면 오른쪽 회전
      var m = e.pointerType === 'touch' ? 1.6 : 1;
      look((e.clientX - lp.clientX) * m, (e.clientY - lp.clientY) * m);
      lp = e;
    }
  });
  ['pointerup', 'pointercancel'].forEach(function (n) { game.addEventListener(n, function () { lp = null; holdReel = false; }); });
  Array.prototype.forEach.call(slots, function (el) {
    el.addEventListener('pointerdown', function (e) {
      e.stopPropagation();
      selectSlot(Number(el.getAttribute('data-slot')));
    });
  });
  Array.prototype.forEach.call(pad.querySelectorAll('button'), function (b) {
    var c = b.getAttribute('data-k');
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); K[c] = true; });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { b.addEventListener(n, function () { K[c] = false; }); });
  });
})();
</script>
</body>
